<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFPLUM — Portail Mission</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f0f4f8;min-height:100vh}
.bar{background:#1d4ed8;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:10}
.bar-logo{font-size:17px;font-weight:900;letter-spacing:1px}
.bar-sub{font-size:11px;color:#93c5fd;margin-top:2px}
.wrap{max-width:600px;margin:0 auto;padding:20px 14px 40px}
.banner{border-radius:12px;padding:16px 18px;margin-bottom:18px;display:flex;align-items:center;gap:12px;font-size:14px}
.banner.attente{background:#fef3c7;border-left:4px solid #f59e0b}
.banner.confirme{background:#dbeafe;border-left:4px solid #3b82f6}
.banner.valide{background:#dcfce7;border-left:4px solid #22c55e}
.banner.ndf{background:#f3e8ff;border-left:4px solid #9333ea}
.banner.done{background:#dcfce7;border-left:4px solid #16a34a}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07);margin-bottom:14px;overflow:hidden}
.card-head{padding:12px 18px;background:#f8fafc;border-bottom:1px solid #e5e7eb;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#6b7280}
.card-body{padding:16px 18px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid #f1f5f9;font-size:14px;gap:8px}
.row:last-child{border-bottom:none}
.rl{color:#6b7280;font-weight:600;min-width:110px;flex-shrink:0;font-size:12px}
.rv{color:#111;font-weight:500;text-align:right}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:10px;align-items:flex-start}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:1px;font-weight:700}
.dot.ok{background:#dcfce7;color:#166534}
.dot.cur{background:#dbeafe;color:#1d4ed8}
.dot.todo{background:#f1f5f9;color:#9ca3af}
.step-txt{flex:1}
.step-lbl{font-size:13px;font-weight:700}
.step-date{font-size:11px;color:#6b7280;margin-top:2px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;transition:opacity .15s}
.btn:disabled{opacity:.5;cursor:default}
.btn:active:not(:disabled){opacity:.8}
.btn-blue{background:#1d4ed8;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.btn-purple{background:#7c3aed;color:#fff}
.btn-grey{background:#f1f5f9;color:#374151;border:1px solid #e2e8f0}
.inp-lbl{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#374151;margin-bottom:4px}
.inp{width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:12px}
.inp:focus{outline:none;border-color:#1d4ed8}
.total-box{background:#eff6ff;border-radius:8px;padding:14px;text-align:center;font-size:22px;font-weight:900;color:#1d4ed8;margin:14px 0}
.chk-row{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:12px;cursor:pointer}
.chk-row input{width:16px;height:16px;cursor:pointer}
.info{text-align:center;padding:30px 16px;color:#6b7280}
.info-ico{font-size:40px;margin-bottom:10px}
.info-title{font-weight:700;font-size:16px;color:#111;margin-bottom:6px}
.err-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:24px;text-align:center;color:#991b1b}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-logo">🪂 FFPLUM</div>
  <div class="bar-sub" id="bar-ref">Portail Mission</div>
</div>

<div class="wrap">
  <div id="loading" class="info"><div class="info-ico">⏳</div><div>Chargement…</div></div>
  <div id="err" style="display:none" class="err-box"><div style="font-size:36px;margin-bottom:10px">⚠️</div><div id="err-msg">Erreur</div></div>
  <div id="app" style="display:none"></div>
</div>

<script>
const SB_URL = 'https://wctpwgnavsvyueypgicd.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjdHB3Z25hdnN2eXVleXBnaWNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MjgxMzUsImV4cCI6MjA5MDAwNDEzNX0.W--8Qr5Pf0Dsy8CGlsLOCWRRIyK6VOINp3zXzM3ii2M';
const sb   = supabase.createClient(SB_URL, SB_KEY);
const p    = new URLSearchParams(location.search);
const TOK  = p.get('t') || p.get('token') || '';
const ROLE = p.get('r') || p.get('role') || 'enc';

let D = null; // données de la mission

/* ── Chargement ─────────────────────────────────────────────────────────── */
async function load() {
  if (!TOK) { err('Lien invalide — identifiant manquant.'); return; }
  try {
    const { data, error } = await sb.from('stol_shared').select('data').eq('id','om_p_'+TOK).single();
    if (error || !data) { err('Mission introuvable. Ce lien est peut-être expiré.'); return; }
    D = typeof data.data === 'string' ? JSON.parse(data.data) : data.data;
    render();
  } catch(e) { err('Erreur de connexion. Vérifiez internet.'); }
}

function err(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('err').style.display = 'block';
  document.getElementById('err-msg').textContent = msg;
}

/* ── Sauvegarde ─────────────────────────────────────────────────────────── */
async function save(patch) {
  Object.assign(D, patch, { updated_at: new Date().toISOString() });
  const { error } = await sb.from('stol_shared').upsert({ id:'om_p_'+TOK, data: JSON.stringify(D) });
  if (error) { alert('Erreur de sauvegarde. Réessayez.'); throw error; }
}

/* ── Utilitaires ─────────────────────────────────────────────────────────── */
function f(v) { return v || '—'; }
function fd(iso) { return iso ? new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}) : ''; }
function ft(v) {
  if (!v) return '—';
  var l=[];
  if(v.train)  l.push('Train');
  if(v.federal)l.push('Véhicule fédéral');
  if(v.perso)  l.push('Véhicule personnel');
  if(v.autre)  l.push('Autre');
  if(v.precision) l.push('('+v.precision+')');
  return l.join(' · ')||'—';
}
function enc(s){ return encodeURIComponent(s); }
function portalUrl(role) {
  return location.href.split('?')[0] + '?t=' + TOK + (role ? '&r=' + role : '');
}

/* ── Rendu principal ─────────────────────────────────────────────────────── */
function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  var el = document.getElementById('bar-ref');
  el.textContent = 'Réf. ' + (D.ref||'') + '  ·  ' + (D.prenom||'') + ' ' + (D.nom||'');

  if (ROLE === 'pres' || ROLE === 'president') {
    renderPres();
  } else {
    renderEnc();
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE ENCADRANT
══════════════════════════════════════════════════════════════════════════ */
function renderEnc() {
  var st = D.statut || 'genere';
  var banners = {
    genere:           { cls:'attente', ico:'📋', txt:'En attente de votre confirmation' },
    confirme_enc:     { cls:'confirme', ico:'⏳', txt:'Confirmé — en attente de la présidence' },
    valide:           { cls:'valide',   ico:'✅', txt:'Mission validée par la présidence' },
    ndf_envoyee:      { cls:'ndf',      ico:'📊', txt:'NDF envoyée — en cours de traitement' },
    ndf_validee:      { cls:'done',     ico:'💳', txt:'NDF validée — remboursement en cours' }
  };
  var bn = banners[st] || banners.genere;

  var h = '';
  h += '<div class="banner '+bn.cls+'"><span style="font-size:28px">'+bn.ico+'</span>'
     + '<strong>'+bn.txt+'</strong></div>';

  // Fiche mission
  h += '<div class="card"><div class="card-head">📋 Ordre de Mission — N° '+f(D.ref)+'</div><div class="card-body">'
     + row('Bénéficiaire', '<strong>'+f(D.prenom)+' '+f(D.nom)+'</strong>')
     + row('Fonction', f(D.role))
     + row('Compétition', f(D.compNom))
     + row('Lieu', f(D.lieu))
     + row('Dates', f(D.dates))
     + row('Objet', f(D.objet))
     + row('Transport', ft(D.transport))
     + '</div></div>';

  // Suivi
  h += '<div class="card"><div class="card-head">📍 Suivi</div><div class="card-body"><div class="steps">'
     + step(st, ['confirme_enc','valide','ndf_envoyee','ndf_validee'], '✍️', 'Confirmation encadrant', D.confirme_at)
     + step(st, ['valide','ndf_envoyee','ndf_validee'], '✅', 'Validation présidence', D.valide_at)
     + step(st, ['ndf_envoyee','ndf_validee'], '📊', 'NDF déposée', D.ndf_at)
     + step(st, ['ndf_validee'], '💳', 'Remboursement validé', D.ndf_validee_at)
     + '</div></div></div>';

  // Action selon statut
  if (st === 'genere') {
    h += '<div class="card"><div class="card-head">✍️ Votre confirmation</div><div class="card-body">'
       + '<p style="font-size:14px;color:#374151;line-height:1.6;margin-bottom:16px">Confirmez votre participation à cette mission. Votre confirmation sera transmise à la présidence pour validation.</p>'
       + '<button class="btn btn-blue" onclick="confirmer()">✅ Je confirme ma participation</button>'
       + '</div></div>';
  } else if (st === 'valide') {
    h += renderNdfForm();
  } else if (st === 'ndf_validee' && D.ndf) {
    h += '<div class="card"><div class="card-body info">'
       + '<div class="info-ico">💳</div>'
       + '<div class="info-title">Remboursement validé</div>'
       + '<div>Montant : <strong>'+(D.ndf.total||0).toFixed(2)+' €</strong></div>'
       + '</div></div>';
  }

  document.getElementById('app').innerHTML = h;
  if (st === 'valide') initNdf();
}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE PRÉSIDENTE
══════════════════════════════════════════════════════════════════════════ */
function renderPres() {
  var st = D.statut || 'genere';
  var nom = (D.prenom||'') + ' ' + (D.nom||'');
  var h = '';

  if (st !== 'confirme_enc') {
    var msg = st === 'valide'   ? '✅ Cette mission a déjà été validée.'
            : st === 'genere'   ? '⏳ L\'encadrant n\'a pas encore confirmé.'
            : '📊 Mission en cours de traitement NDF.';
    h = '<div class="banner confirme"><span style="font-size:24px">ℹ️</span><span>'+msg+'</span></div>';
    h += '<div class="card"><div class="card-head">📋 Ordre de Mission — '+f(D.ref)+'</div><div class="card-body">'
       + row('Encadrant', '<strong>'+nom+'</strong>')
       + row('Fonction', f(D.role))
       + row('Compétition', f(D.compNom))
       + row('Lieu', f(D.lieu))
       + row('Dates', f(D.dates))
       + row('Transport', ft(D.transport))
       + '</div></div>';
    document.getElementById('app').innerHTML = h;
    return;
  }

  h += '<div class="banner confirme"><span style="font-size:28px">⏳</span>'
     + '<strong>'+nom+' a confirmé — validation requise</strong></div>';

  h += '<div class="card"><div class="card-head">📋 Ordre de Mission — '+f(D.ref)+'</div><div class="card-body">'
     + row('Encadrant', '<strong>'+nom+'</strong>')
     + row('Fonction', f(D.role))
     + row('Compétition', f(D.compNom))
     + row('Lieu', f(D.lieu))
     + row('Dates', f(D.dates))
     + row('Objet', f(D.objet))
     + row('Transport', ft(D.transport))
     + (D.confirme_at ? row('Confirmé le', fd(D.confirme_at)) : '')
     + '</div></div>';

  h += '<div class="card"><div class="card-head">⚖️ Votre décision</div><div class="card-body">'
     + '<button class="btn btn-green" id="btn-val" onclick="valider()">✅ Valider cette mission</button>'
     + '<button class="btn btn-grey" onclick="rejeter()">✗ Rejeter</button>'
     + '</div></div>';

  document.getElementById('app').innerHTML = h;
}

/* ══════════════════════════════════════════════════════════════════════════
   NDF
══════════════════════════════════════════════════════════════════════════ */
function renderNdfForm() {
  var cfg = D.odmConfig || {};
  var b1l = cfg.bareme1Label || 'Encadrants';
  var b1t = cfg.bareme1Taux || 0.408;
  var b2l = cfg.bareme2Label || 'Compétiteurs';
  var b2t = cfg.bareme2Taux || 0.200;
  var n   = D.ndf || {};

  return '<div class="card"><div class="card-head">📊 Note de Frais</div><div class="card-body">'
    + '<label class="inp-lbl">Barème kilométrique</label>'
    + '<select class="inp" id="n-bar" onchange="calc()">'
    + '<option value="'+b1t+'" '+((!n.bareme||n.bareme==b1t)?'selected':'')+'>'+b1l+' — '+b1t+' €/km</option>'
    + '<option value="'+b2t+'" '+(n.bareme==b2t?'selected':'')+'>'+b2l+' — '+b2t+' €/km</option>'
    + '</select>'
    + '<label class="inp-lbl">Kilométrage</label>'
    + '<input class="inp" type="number" id="n-km" min="0" step="1" value="'+(n.km||'')+'" oninput="calc()" placeholder="0 km">'
    + '<label class="chk-row"><input type="checkbox" id="n-ar" '+(n.ar?'checked':'')+' onchange="calc()"> Aller-retour (km × 2)</label>'
    + '<label class="chk-row"><input type="checkbox" id="n-auto" '+(n.autoroute?'checked':'')+' onchange="calc()"> Frais d\'autoroute</label>'
    + '<div id="n-auto-row" style="display:'+(n.autoroute?'block':'none')+'">'
    + '<label class="inp-lbl">Montant autoroute (€)</label>'
    + '<input class="inp" type="number" id="n-auto-val" min="0" step="0.01" value="'+(n.autoroute_montant||'')+'" oninput="calc()" placeholder="0.00"></div>'
    + '<label class="inp-lbl">Repas (€)</label>'
    + '<input class="inp" type="number" id="n-rep" min="0" step="0.01" value="'+(n.repas||'')+'" oninput="calc()" placeholder="0.00">'
    + '<label class="inp-lbl">Commentaire</label>'
    + '<textarea class="inp" id="n-note" rows="2" placeholder="Précisez si nécessaire…">'+(n.notes||'')+'</textarea>'
    + '<div class="total-box" id="n-tot">Total : — €</div>'
    + '<button class="btn btn-purple" id="btn-ndf" onclick="envoyerNDF()">📤 Envoyer ma NDF</button>'
    + '</div></div>';
}

function initNdf() { calc(); }

function calc() {
  var km  = parseFloat(document.getElementById('n-km').value)||0;
  var bar = parseFloat(document.getElementById('n-bar').value)||0;
  var ar  = document.getElementById('n-ar').checked;
  var aut = document.getElementById('n-auto').checked;
  var autV = parseFloat((document.getElementById('n-auto-val')||{}).value)||0;
  var rep = parseFloat(document.getElementById('n-rep').value)||0;
  var row = document.getElementById('n-auto-row');
  if (row) row.style.display = aut ? 'block' : 'none';
  var tot = (ar ? km*2 : km)*bar + (aut?autV:0) + rep;
  var el = document.getElementById('n-tot');
  if (el) el.textContent = 'Total : ' + tot.toFixed(2) + ' €';
}

/* ══════════════════════════════════════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════════════════════════════════════ */
async function confirmer() {
  var btn = document.querySelector('.btn-blue');
  if (!btn) return;
  btn.disabled = true; btn.textContent = '⏳ Envoi…';
  try {
    await save({ statut:'confirme_enc', confirme_at: new Date().toISOString() });
  } catch(e) { return; }

  var cfg    = D.odmConfig||{};
  var nom    = (D.prenom||'')+' '+(D.nom||'');
  var pEmail = cfg.presidentEmail||'';
  var pNom   = cfg.presidentNom||'la Présidente';
  var url    = portalUrl('pres');

  var sujet  = enc('✅ Confirmation ODM '+D.ref+' — '+nom+' — '+D.compNom);
  var corps  = enc(
    'Bonjour '+pNom+',\n\n'
   +nom+' a confirmé sa participation pour la compétition «'+D.compNom+'».\n\n'
   +'Mission : '+D.ref+' | Dates : '+(D.dates||'—')+' | Fonction : '+(D.role||'—')+'\n\n'
   +'👉 Cliquez ici pour valider :\n'+url+'\n\n'
   +'Cordialement,\n'+nom
  );
  var mailto = (pEmail?'mailto:'+pEmail:'mailto:')+'?subject='+sujet+'&body='+corps;

  render();
  window.location.href = mailto;
}

async function valider() {
  var btn = document.getElementById('btn-val');
  if (btn) { btn.disabled=true; btn.textContent='⏳…'; }
  try {
    await save({ statut:'valide', valide_at: new Date().toISOString() });
  } catch(e) { return; }

  var cfg  = D.odmConfig||{};
  var nom  = (D.prenom||'')+' '+(D.nom||'');
  var url  = portalUrl('enc');
  var sujet= enc('✅ Mission validée — '+D.ref+' — '+D.compNom);
  var corps= enc(
    'Bonjour '+(D.prenom||'')+',\n\n'
   +'Votre Ordre de Mission ('+D.ref+') a été validé.\n\n'
   +'Vous pouvez effectuer votre mission et déposer votre NDF ici :\n'+url+'\n\n'
   +'Cordialement,\n'+(cfg.presidentNom||'La Présidente')+' — FFPLUM'
  );
  var mailto = 'mailto:'+(D.email||'')+'?subject='+sujet+'&body='+corps;

  render();
  window.location.href = mailto;
}

async function rejeter() {
  if (!confirm('Rejeter cet OM ?')) return;
  await save({ statut:'genere', rejete_at: new Date().toISOString() });
  render();
}

async function envoyerNDF() {
  var km  = parseFloat(document.getElementById('n-km').value)||0;
  var bar = parseFloat(document.getElementById('n-bar').value)||0;
  var ar  = document.getElementById('n-ar').checked;
  var aut = document.getElementById('n-auto').checked;
  var autV= parseFloat((document.getElementById('n-auto-val')||{}).value)||0;
  var rep = parseFloat(document.getElementById('n-rep').value)||0;
  var note= (document.getElementById('n-note').value||'').trim();
  var kmT = ar ? km*2 : km;
  var tot = kmT*bar + (aut?autV:0) + rep;

  var btn = document.getElementById('btn-ndf');
  if (btn) { btn.disabled=true; btn.textContent='⏳ Envoi…'; }

  var ndfData = { km:km, bareme:bar, ar:ar, autoroute:aut, autoroute_montant:autV, repas:rep, notes:note, total:tot, date:new Date().toISOString() };
  try {
    await save({ statut:'ndf_envoyee', ndf:ndfData, ndf_at:new Date().toISOString() });
  } catch(e) { return; }

  var cfg       = D.odmConfig||{};
  var nom       = (D.prenom||'')+' '+(D.nom||'');
  var cEmail    = cfg.comptableEmail || cfg.presidentEmail || '';
  var sujet     = enc('📊 NDF '+D.ref+' — '+nom+' — '+D.compNom);
  var corps     = enc(
    'Bonjour,\n\n'
   +'Note de Frais de '+nom+' / Compétition : '+D.compNom+'\n\n'
   +'============================\n'
   +'Réf. OM    : '+D.ref+'\n'
   +'Kilométrage : '+km+' km'+(ar?' (A/R)':'')+' × '+bar+' €/km = '+(kmT*bar).toFixed(2)+' €\n'
   +(aut?'Autoroute   : '+autV.toFixed(2)+' €\n':'')
   +(rep?'Repas       : '+rep.toFixed(2)+' €\n':'')
   +(note?'Commentaire : '+note+'\n':'')
   +'============================\n'
   +'TOTAL       : '+tot.toFixed(2)+' €\n'
   +'============================\n\n'
   +'Cordialement,\n'+nom
  );
  var mailto = (cEmail?'mailto:'+cEmail:'mailto:')+'?subject='+sujet+'&body='+corps;

  render();
  window.location.href = mailto;
}

/* ── Helpers HTML ─────────────────────────────────────────────────────── */
function row(l,v){ return '<div class="row"><span class="rl">'+l+'</span><span class="rv">'+v+'</span></div>'; }
function step(cur, doneWhen, ico, lbl, date){
  var done = doneWhen.includes(cur);
  var cls  = done ? 'ok' : 'todo';
  return '<div class="step">'
    +'<div class="dot '+cls+'">'+(done?'✓':ico)+'</div>'
    +'<div class="step-txt">'
    +'<div class="step-lbl" style="color:'+(done?'#166534':'#9ca3af')+'">'+lbl+'</div>'
    +(done&&date?'<div class="step-date">'+fd(date)+'</div>':'')
    +'</div></div>';
}

load();
</script>
</body>
</html>
